name: Firestore rules tests

# Runs the Firestore Security Rules suite against the local emulator, plus the backend's
# text-based rules contract tests.
# Uses the `demo-happy-farms` project id, which can never reach a real Firebase project.
# Third-party actions are pinned to full commit SHAs (tag shown in the trailing comment).
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'tests/firestore-rules/**'
      - 'backend/src/security/firestoreRules.contract.test.ts'
      - 'backend/src/security/feedLoadSecurityRules.test.ts'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches: [master]
    paths:
      - 'firestore.rules'
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - 'package.json'
      - 'tests/firestore-rules/**'
      - 'backend/src/security/firestoreRules.contract.test.ts'
      - 'backend/src/security/feedLoadSecurityRules.test.ts'
      - '.github/workflows/firestore-rules.yml'

permissions:
  contents: read

jobs:
  emulator:
    name: Emulator rules suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Both rules files must be identical
        run: cmp firestore.rules firebase/firestore.rules

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run rules tests in the Firestore emulator
        run: npm run test:rules

  contract:
    name: Backend rules contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run rules contract tests
        working-directory: backend
        run: npx vitest run src/security/firestoreRules.contract.test.ts src/security/feedLoadSecurityRules.test.ts
